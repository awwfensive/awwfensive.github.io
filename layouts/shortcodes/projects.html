<ul class="project-index" aria-label="Open-source projects">
  {{ range hugo.Data.projects }}
    <li>
      <a class="project-index-link" href="{{ .url }}">
        <div class="project-identity"><h3>{{ .name }}</h3>{{ with .status }}<span>{{ . }}</span>{{ end }}</div>
        <p>{{ .desc }}</p>
        <span class="project-source">GitHub <span aria-hidden="true">↗</span></span>
      </a>
    </li>
  {{ end }}
</ul>
