<ul class="project-list" aria-label="Projects">
  {{ range site.Data.projects }}
    <li class="project-item">
      <a class="project-card" href="{{ .url }}">
        <span class="project-title">{{ .name }}</span>
        <p class="project-desc">{{ .desc }}</p>
      </a>
    </li>
  {{ end }}
</ul>
