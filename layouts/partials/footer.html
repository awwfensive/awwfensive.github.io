<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function () {
      var root = document.documentElement;
      var light = root.getAttribute('data-theme') === 'light';
      if (light) root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', 'light');
      try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (e) { }
    });

    var dock = document.getElementById('dock');
    var pill = document.getElementById('dock-pill');
    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = dock.classList.toggle('open');
      pill.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function () {
      dock.classList.remove('open');
      pill.setAttribute('aria-expanded', 'false');
    });

    // Scrollspy label on the home page
    var label = document.getElementById('dock-label');
    var sections = [
      ['writing', 'Writing'],
      ['work', 'Work'],
      ['opensource', 'Findings'],
      ['experience', 'Experience']
    ].map(function (s) { return [document.getElementById(s[0]), s[1]]; })
      .filter(function (s) { return s[0]; });

    if (sections.length) {
      var spy = function () {
        var current = 'Home';
        var line = window.innerHeight * 0.4;
        for (var j = 0; j < sections.length; j++) {
          var rect = sections[j][0].getBoundingClientRect();
          if (rect.top <= line) { current = sections[j][1]; break; }
        }
        label.textContent = current;
      };
      window.addEventListener('scroll', spy, { passive: true });
      spy();
    }

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Scramble-decode section headings when they scroll into view
    var CHARS = '!<>-_\\/[]{}—=+*^?#$%&';
    var heads = document.querySelectorAll('.home-block-head h2, .list-page > h1, .hero h1');
    if (!reduced && 'IntersectionObserver' in window) {
      var decode = function (el) {
        var target = el.dataset.text;
        var frame = 0;
        var total = target.length * 3 + 12;
        var tick = function () {
          var out = '';
          for (var i = 0; i < target.length; i++) {
            if (frame / 3 > i) out += target[i];
            else if (frame / 3 > i - 4) out += CHARS[Math.floor(Math.random() * CHARS.length)];
            else out += ' ';
          }
          el.textContent = out;
          frame++;
          if (frame <= total) requestAnimationFrame(tick);
          else el.textContent = target;
        };
        tick();
      };
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            io.unobserve(e.target);
            decode(e.target);
          }
        });
      }, { threshold: 0.4 });
      heads.forEach(function (h) {
        h.dataset.text = h.textContent;
        io.observe(h);
      });
    }

  })();
</script>
