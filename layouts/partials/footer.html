  <div class="term-bar"><i></i><i></i><i></i><span>aniket@awwfensive: ~</span></div>

</div>
<div class="footer-fineprint">

<nav class="dock" id="dock" aria-label="Site navigation">
  <div class="dock-menu" id="dock-menu">
    <a href="{{ "" | relURL }}">Home</a>
    <a href="{{ "blog/" | relURL }}">Blog</a>
    <a href="{{ "projects/" | relURL }}">Projects</a>
  </div>
  <button class="dock-pill" id="dock-pill" type="button" aria-haspopup="true" aria-expanded="false">
    <span class="dock-ring" aria-hidden="true"></span>
    <span id="dock-label">{{ if .IsHome }}Home{{ else if eq .Section "blog" }}Blog{{ else }}{{ .Title | default "Menu" }}{{ end }}</span>
  </button>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0-15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1m0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1m10-8a1 1 0 0 1-1 1h-1a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1M4 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h1a1 1 0 0 1 1 1m15.07-7.07a1 1 0 0 1 0 1.41l-.71.71a1 1 0 1 1-1.41-1.41l.7-.71a1 1 0 0 1 1.42 0M7.05 16.95a1 1 0 0 1 0 1.41l-.7.71a1 1 0 0 1-1.42-1.41l.71-.71a1 1 0 0 1 1.41 0m12.02 2.12a1 1 0 0 1-1.42 0l-.7-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41M7.05 7.05a1 1 0 0 1-1.41 0l-.71-.7a1 1 0 0 1 1.42-1.42l.7.71a1 1 0 0 1 0 1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.64 13a1 1 0 0 0-1.05-.14 8.05 8.05 0 0 1-3.37.73 8.15 8.15 0 0 1-8.14-8.1 8.6 8.6 0 0 1 .25-2A1 1 0 0 0 8 2.36a10.14 10.14 0 1 0 13.94 11.73 1 1 0 0 0-.3-1.09"/></svg>
  </button>

<script>
  (function () {
    var toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function () {
      var root = document.documentElement;
      var light = root.getAttribute('data-theme') === 'light';
      if (light) root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', 'light');
      try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (e) { }
    });

    var dock = document.getElementById('dock');
    var pill = document.getElementById('dock-pill');
    pill.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = dock.classList.toggle('open');
      pill.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', function () {
      dock.classList.remove('open');
      pill.setAttribute('aria-expanded', 'false');
    });

    // Scrollspy label on the home page
    var label = document.getElementById('dock-label');
    var sections = [
      ['writing', 'Writing'],
      ['work', 'Work'],
      ['opensource', 'Findings'],
      ['experience', 'Experience']
    ].map(function (s) { return [document.getElementById(s[0]), s[1]]; })
      .filter(function (s) { return s[0]; });

    if (sections.length) {
      var spy = function () {
        var current = 'Home';
        var line = window.innerHeight * 0.4;
        for (var j = 0; j < sections.length; j++) {
          var rect = sections[j][0].getBoundingClientRect();
          if (rect.top <= line) { current = sections[j][1]; break; }
        }
        label.textContent = current;
      };
      window.addEventListener('scroll', spy, { passive: true });
      spy();
    }

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Scramble-decode section headings when they scroll into view
    var CHARS = '!<>-_\\/[]{}—=+*^?#$%&';
    var heads = document.querySelectorAll('.home-block-head h2, .list-page > h1, .hero h1');
    if (!reduced && 'IntersectionObserver' in window) {
      var decode = function (el) {
        var target = el.dataset.text;
        var frame = 0;
        var total = target.length * 3 + 12;
        var tick = function () {
          var out = '';
          for (var i = 0; i < target.length; i++) {
            if (frame / 3 > i) out += target[i];
            else if (frame / 3 > i - 4) out += CHARS[Math.floor(Math.random() * CHARS.length)];
            else out += ' ';
          }
          el.textContent = out;
          frame++;
          if (frame <= total) requestAnimationFrame(tick);
          else el.textContent = target;
        };
        tick();
      };
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            io.unobserve(e.target);
            decode(e.target);
          }
        });
      }, { threshold: 0.4 });
      heads.forEach(function (h) {
        h.dataset.text = h.textContent;
        io.observe(h);
      });
    }

    // Live terminal in the footer
    var termBody = document.getElementById('term-body');
    if (termBody) {
      var SCRIPT = [
        ['$ whoami', 'aniket — security researcher / builder'],
        ['$ cat /etc/motd', 'break. build. document.'],
        ['$ grep -ri "cve" ~/advisories', 'CVE-2026-77314: path traversal in flyto-core (fixed upstream)'],
        ['$ ./hunt --next', 'scanning targets... more to come <3']
      ];

      var cursor = document.createElement('span');
      cursor.className = 'cursor';

      if (reduced) {
        SCRIPT.forEach(function (pair) {
          var p = document.createElement('span');
          p.className = 't-prompt';
          p.textContent = pair[0] + '\n';
          var o = document.createElement('span');
          o.className = 't-out';
          o.textContent = pair[1] + '\n';
          termBody.appendChild(p);
          termBody.appendChild(o);
        });
        termBody.appendChild(cursor);
      } else {
        var li = 0;
        var started = false;

        var typeLine = function (text, cls, done) {
          var span = document.createElement('span');
          span.className = cls;
          termBody.insertBefore(span, cursor);
          var i = 0;
          var speed = cls === 't-prompt' ? 55 : 14;
          var step = function () {
            span.textContent = text.slice(0, ++i);
            if (i < text.length) setTimeout(step, speed);
            else {
              span.textContent += '\n';
              setTimeout(done, cls === 't-prompt' ? 350 : 700);
            }
          };
          step();
        };

        var next = function () {
          if (li >= SCRIPT.length) {
            setTimeout(function () {
              termBody.textContent = '';
              termBody.appendChild(cursor);
              li = 0;
              next();
            }, 6000);
            return;
          }
          var pair = SCRIPT[li++];
          typeLine(pair[0], 't-prompt', function () {
            typeLine(pair[1], 't-out', next);
          });
        };

        termBody.appendChild(cursor);
        if ('IntersectionObserver' in window) {
          var tio = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting && !started) {
              started = true;
              tio.disconnect();
              next();
            }
          }, { threshold: 0.2 });
          tio.observe(termBody);
        } else {
          started = true;
          next();
        }
      }
    }
  })();
</script>
