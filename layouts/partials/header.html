{{ $current := .RelPermalink }}
<nav class="top-tabs" aria-label="Main navigation">
  {{ range .Site.Menus.main }}
    {{ $target := .URL | relURL }}
    {{ $active := or (eq $current $target) (and (ne $target "/") (hasPrefix $current $target)) }}
    <a href="{{ .URL }}" {{ if $active }}aria-current="page"{{ end }}>{{ .Name }}</a>
  {{ end }}
</nav>
