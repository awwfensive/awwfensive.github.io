<script src="https://cdn.jsdelivr.net/gh/adryd325/oneko.js@latest/oneko.js" defer data-cat="/oneko.gif"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) { }
  })();
</script>

<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #111113;
    --surface-2: #18181b;
    --text: #ededed;
    --text-muted: #a1a1a1;
    --text-faint: #7a7a7a;
    --border: #232326;
    --border-soft: #1c1c1f;
    --accent: #c084fc;
    --dot: #a855f7;
    --link: #ededed;
    --glow: #2563eb;
    --cell-0: #1b1b1e;
    --cell-1: #3d3d42;
    --cell-2: #6e6e75;
    --cell-3: #a8a8b0;
    --cell-4: #f4f4f5;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f1f1f2;
    --text: #111113;
    --text-muted: #55555c;
    --text-faint: #86868c;
    --border: #e2e2e5;
    --border-soft: #ebebee;
    --accent: #7c3aed;
    --dot: #8b5cf6;
    --link: #111113;
    --glow: #3b82f6;
    --cell-0: #e9e9ec;
    --cell-1: #c3c3c9;
    --cell-2: #8f8f97;
    --cell-3: #55555c;
    --cell-4: #17171a;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    max-width: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    transition: background .25s ease, color .25s ease;
  }

  ::selection {
    background: color-mix(in srgb, var(--dot) 35%, transparent);
    color: var(--text);
  }

  body > header {
    display: flex;
    justify-content: center;
    padding: 22px 20px 0;
  }

  .top-tabs {
    display: inline-flex;
    gap: 28px;
  }

  .top-tabs a {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-faint);
    transition: color .15s ease;
  }

  .top-tabs a:hover { color: var(--text); }

  .top-tabs a[aria-current="page"] { color: var(--text); }

  main {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 72px 20px 96px;
  }

  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--accent); }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--sans);
    color: var(--text);
    line-height: 1.25;
    margin: 0;
  }

  p { margin: 0 0 1em; }

  img { max-width: 100%; }

  /* ============ Home: hero ============ */

  .hero { margin-bottom: 40px; }

  .hero-avatar {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    object-fit: cover;
    display: block;
    margin-bottom: 20px;
    border: 1px solid var(--border-soft);
  }

  .hero h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  .hero-tagline {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.7;
    margin: 0 0 22px;
  }

  .social-row {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 0 0 34px;
    padding: 0;
    list-style: none;
  }

  .social-row a {
    color: var(--text);
    display: inline-flex;
    opacity: .9;
    transition: opacity .15s ease, transform .15s ease;
  }

  .social-row a:hover { opacity: 1; transform: translateY(-2px); color: var(--text); }

  .social-row svg { width: 19px; height: 19px; fill: currentColor; }

  /* ============ Home: contribution graph ============ */

  .gh-graph { margin-bottom: 56px; }

  .gh-months {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 2px 6px;
  }

  .gh-grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 1fr);
    gap: 2.5px;
    width: 100%;
  }

  .gh-grid i {
    display: block;
    aspect-ratio: 1;
    border-radius: 2.5px;
    background: var(--cell-0);
  }

  .gh-grid i[data-l="1"] { background: var(--cell-1); }
  .gh-grid i[data-l="2"] { background: var(--cell-2); }
  .gh-grid i[data-l="3"] { background: var(--cell-3); }
  .gh-grid i[data-l="4"] { background: var(--cell-4); }

  .gh-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .gh-legend { display: inline-flex; align-items: center; gap: 4px; }

  .gh-legend i {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }

  /* ============ Home: sections ============ */

  .home-block { margin-bottom: 56px; }

  .home-block-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .home-block-head h2 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .view-all {
    font-size: 13px;
    color: var(--text-muted);
  }

  .view-all:hover { color: var(--accent); }

  /* Experience */

  .xp-item {
    border-bottom: 1px solid var(--border-soft);
  }

  .xp-item:last-child { border-bottom: 0; }

  .xp-item summary {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    cursor: pointer;
    list-style: none;
    font-size: 15.5px;
    font-weight: 500;
  }

  .xp-item summary::-webkit-details-marker { display: none; }

  .xp-logo {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    flex-shrink: 0;
  }

  .xp-title { flex: 1; }

  .xp-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
  }

  .xp-chevron {
    width: 16px;
    height: 16px;
    color: var(--text-faint);
    transition: transform .2s ease;
    flex-shrink: 0;
  }

  .xp-item[open] .xp-chevron { transform: rotate(180deg); }

  .xp-body {
    margin: 0;
    padding: 0 0 16px 52px;
    list-style: none;
  }

  .xp-body li {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    padding-left: 14px;
    position: relative;
    margin-bottom: 6px;
    line-height: 1.6;
  }

  .xp-body li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--text-faint);
  }

  .xp-body a { color: var(--text-muted); text-decoration: underline; text-underline-offset: 3px; }
  .xp-body a:hover { color: var(--accent); }

  /* Open Source / findings list */

  .oss-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .oss-list li {
    position: relative;
    padding: 5px 0 5px 20px;
    font-size: 14.5px;
    line-height: 1.55;
  }

  .oss-list li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 13px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--dot);
  }

  .oss-list a { color: var(--text); }
  .oss-list a:hover { color: var(--accent); }

  .oss-kind { color: var(--text-muted); }

  /* Work grid */

  .work-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px 24px;
  }

  .work-card { display: block; }

  .work-thumb {
    aspect-ratio: 16 / 10;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    background: var(--surface);
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
    transition: border-color .2s ease, transform .2s ease;
  }

  .work-card:hover .work-thumb {
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .work-thumb-inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background:
      radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--dot) 14%, transparent), transparent 70%);
  }

  .work-thumb-dots {
    position: absolute;
    top: 10px;
    left: 12px;
    display: flex;
    gap: 5px;
  }

  .work-thumb-dots i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border);
    display: block;
  }

  .work-thumb-name {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .work-thumb-cmd {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
  }

  .work-title {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .work-desc {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0;
  }

  /* Thoughts / blog cards on home */

  .thought-card {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 22px;
    align-items: start;
    margin-bottom: 28px;
  }

  .thought-card:last-child { margin-bottom: 0; }

  .thought-thumb {
    aspect-ratio: 16 / 10;
    border-radius: 12px;
    border: 1px solid var(--border-soft);
    overflow: hidden;
    background: var(--surface);
    position: relative;
    transition: transform .2s ease, border-color .2s ease;
  }

  .thought-card:hover .thought-thumb {
    transform: translateY(-2px);
    border-color: var(--border);
  }

  .thought-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thought-thumb-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-muted);
    background:
      radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--glow) 18%, transparent), transparent 75%);
  }

  .thought-title {
    font-size: 16.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.35;
  }

  .thought-excerpt {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.65;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============ Terminal footer ============ */

  body > footer {
    position: relative;
    margin: 40px auto 0;
    max-width: 620px;
    padding: 0 20px 96px;
  }

  .cursor {
    display: inline-block;
    width: .55em;
    height: 1.1em;
    background: var(--text);
    vertical-align: text-bottom;
    margin-left: 2px;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .dock-ring { animation: none; }
  }

  .footer-fineprint {
    position: relative;
    display: flex;
    justify-content: center;
    gap: 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-muted);
    margin-top: 22px;
  }

  .footer-fineprint a { color: var(--text-muted); }
  .footer-fineprint a:hover { color: var(--text); }

  /* ============ Floating dock ============ */

  .dock {
    position: fixed;
    right: 22px;
    bottom: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }

  .dock-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px 8px 12px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text);
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
    cursor: pointer;
    text-decoration: none;
  }

  .dock-pill:hover { color: var(--text); border-color: var(--text-faint); }

  .dock-ring {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid var(--text);
    border-top-color: transparent;
    display: inline-block;
    animation: dock-spin 3.5s linear infinite;
  }

  @keyframes dock-spin { to { transform: rotate(360deg); } }

  .dock-menu {
    position: absolute;
    right: 0;
    bottom: calc(100% + 10px);
    min-width: 150px;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    display: none;
    flex-direction: column;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
  }

  .dock.open .dock-menu { display: flex; }

  .dock-menu a {
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13.5px;
    color: var(--text);
  }

  .dock-menu a:hover { background: var(--surface-2); color: var(--text); }

  .theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(12px);
    box-shadow: 0 4px 24px rgba(0, 0, 0, .35);
    padding: 0;
  }

  .theme-toggle:hover { border-color: var(--text-faint); }

  .theme-toggle svg { width: 17px; height: 17px; fill: currentColor; }

  :root:not([data-theme="light"]) .icon-moon { display: none; }
  :root[data-theme="light"] .icon-sun { display: none; }

  /* ============ List pages (blog / projects) ============ */

  .list-page > h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .list-page > p,
  .list-page .list-lede {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 34px;
  }

  .post-list {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .post-item { border-bottom: 1px solid var(--border-soft); }

  .post-item:last-child { border-bottom: 0; }

  .post-card {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 15px 2px;
  }

  .post-card:hover .post-title { color: var(--accent); }

  .post-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .post-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    transition: color .15s ease;
  }

  .project-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .project-card {
    display: block;
    height: 100%;
    padding: 18px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface);
    transition: border-color .2s ease, transform .2s ease;
  }

  .project-card:hover {
    border-color: var(--border);
    transform: translateY(-2px);
  }

  .project-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 8px;
  }

  .project-desc {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0;
  }

  /* ============ Single post ============ */

  .post-shell { position: relative; }

  .post-head h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .article-meta {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-faint);
    margin-bottom: 26px;
  }

  .post-head figure {
    margin: 0 0 28px;
  }

  .post-head img,
  article img {
    border-radius: 12px;
    border: 1px solid var(--border-soft);
  }

  .post-toc {
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface);
    padding: 16px 20px;
    margin-bottom: 32px;
    font-size: 13.5px;
  }

  .post-toc::before {
    content: "contents";
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .post-toc ul { margin: 0; padding-left: 18px; }
  .post-toc a { color: var(--text-muted); }
  .post-toc a:hover { color: var(--accent); }

  article {
    font-size: 15px;
    line-height: 1.75;
    color: var(--text);
  }

  article h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 40px 0 14px;
  }

  article h3 {
    font-size: 17px;
    font-weight: 600;
    margin: 30px 0 12px;
  }

  article h4 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }

  article p, article li { color: var(--text-muted); }

  article strong { color: var(--text); }

  article a {
    color: var(--text);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--text-faint);
  }

  article a:hover { color: var(--accent); text-decoration-color: var(--accent); }

  article blockquote {
    margin: 20px 0;
    padding: 4px 20px;
    border-left: 3px solid var(--dot);
    background: var(--surface);
    border-radius: 0 10px 10px 0;
  }

  article hr {
    border: 0;
    border-top: 1px solid var(--border-soft);
    margin: 36px 0;
  }

  article table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin: 20px 0;
    display: block;
    overflow-x: auto;
  }

  article th, article td {
    border: 1px solid var(--border-soft);
    padding: 8px 12px;
    text-align: left;
    color: var(--text-muted);
  }

  article th { color: var(--text); background: var(--surface); }

  article figure { margin: 24px 0; }

  article figcaption {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
    margin-top: 8px;
  }

  /* code */

  code {
    font-family: var(--mono);
    font-size: .88em;
  }

  article :not(pre) > code {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-radius: 5px;
    padding: 1.5px 6px;
    color: var(--text);
  }

  pre {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 16px 18px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.6;
    margin: 20px 0;
  }

  .highlight { margin: 20px 0; }
  .highlight pre { margin: 0; }

  .highlight pre::-webkit-scrollbar { height: 6px; }
  .highlight pre::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  /* chroma tokens (dark-tuned, readable in light too via vars) */
  .highlight .c, .highlight .ch, .highlight .cm, .highlight .c1,
  .highlight .cs, .highlight .cp, .highlight .cpf { color: var(--text-faint); font-style: italic; }
  .highlight .k, .highlight .kc, .highlight .kd, .highlight .kn,
  .highlight .kp, .highlight .kr, .highlight .kt { color: var(--accent); }
  .highlight .s, .highlight .sa, .highlight .sb, .highlight .sc,
  .highlight .dl, .highlight .sd, .highlight .s2, .highlight .se,
  .highlight .sh, .highlight .si, .highlight .sx, .highlight .sr,
  .highlight .s1, .highlight .ss { color: #86c5a4; }
  :root[data-theme="light"] .highlight .s, :root[data-theme="light"] .highlight .s1,
  :root[data-theme="light"] .highlight .s2, :root[data-theme="light"] .highlight .sd { color: #22773f; }
  .highlight .m, .highlight .mb, .highlight .mf, .highlight .mh,
  .highlight .mi, .highlight .il, .highlight .mo { color: #d8a657; }
  .highlight .nf, .highlight .fm, .highlight .nx { color: var(--text); }
  .highlight .nb, .highlight .bp, .highlight .nc, .highlight .nn,
  .highlight .nd, .highlight .nt { color: #7fb4ca; }
  :root[data-theme="light"] .highlight .nb, :root[data-theme="light"] .highlight .nt { color: #1c6ca8; }
  .highlight .o, .highlight .ow, .highlight .p { color: var(--text-muted); }
  .highlight .err { color: #e46876; }
  .highlight .gd { color: #e46876; }
  .highlight .gi { color: #86c5a4; }

  /* post nav */

  .post-nav {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--border-soft);
  }

  .post-nav-slot { flex: 1; }
  .post-nav-next { text-align: right; }

  .post-nav a { display: block; text-decoration: none; }

  .post-nav-dir {
    display: block;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 4px;
  }

  .post-nav-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .post-nav a:hover .post-nav-title { color: var(--accent); }

  /* reading progress + back to top */

  .reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    width: 0;
    background: var(--dot);
    z-index: 80;
  }

  .back-to-top {
    position: fixed;
    right: 22px;
    bottom: 74px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 60;
    backdrop-filter: blur(12px);
  }

  .back-to-top.is-visible { opacity: 1; pointer-events: auto; }

  /* ============ responsive ============ */

  @media (max-width: 640px) {
    main { padding: 48px 18px 80px; }

    .work-grid { grid-template-columns: 1fr; }

    .project-list { grid-template-columns: 1fr; }

    .thought-card { grid-template-columns: 1fr; gap: 12px; }

    .xp-date { display: none; }

    .gh-months span:nth-child(even) { display: none; }

    .dock { right: 14px; bottom: 14px; }

    .back-to-top { display: none; }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!document.querySelector('.post-shell')) return;
    var progress = document.createElement('div');
    progress.className = 'reading-progress';
    document.body.appendChild(progress);

    var backToTop = document.createElement('button');
    backToTop.className = 'back-to-top';
    backToTop.type = 'button';
    backToTop.setAttribute('aria-label', 'Back to top');
    backToTop.textContent = '^';
    document.body.appendChild(backToTop);

    var update = function () {
      var scrollable = document.documentElement.scrollHeight - window.innerHeight;
      var ratio = scrollable > 0 ? window.scrollY / scrollable : 0;
      progress.style.width = (ratio * 100).toFixed(2) + '%';
      backToTop.classList.toggle('is-visible', window.scrollY > 420);
    };

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();

    backToTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
</script>
