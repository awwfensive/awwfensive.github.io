baseURL = "https://awwfensive.github.io/"
theme = "hugo-bearblog"
title = "aniket/awwfensive"
author = "aniket"
copyright = "Copyright (c) 2026, Aniket."
locale = "en-US"

# publishDir = "docs"
enableRobotsTXT = true

disableKinds = ["taxonomy", "term"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  blog = "/:slug/"

[params]
  description = "Aniket (Awwfensive) researches AI security, autonomous security testing, agent permissions, and software vulnerabilities. Read disclosures, analyses, and notes."
  tagline = "Break. Build. Document."
  social_image = "/images/social.png"
  social_image_alt = "Awwfensive — Aniket. AI security and vulnerability research. Break. Build. Document."
  favicon = "/favicon.png"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 2

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 3

[[menu.main]]
  name = "Current focus"
  url = "/now/"
  weight = 4

[[menu.main]]
  name = "Notes"
  url = "/notes/"
  weight = 5

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 6

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = 'xcode'
    tabWidth = 4

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    endLevel = 2
    ordered = false
    startLevel = 2
